<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企業情境操作手冊</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f0;color:#22483c;font:16px/1.8 system-ui,sans-serif}main{max-width:900px;padding:28px 20px;margin:auto}h1{font-size:30px;line-height:1.4}h2{font-size:23px;line-height:1.5}p{margin:12px 0}.eyebrow{font-size:13px;color:#00796a;font-weight:700}article{padding:26px;background:white;border:1px solid #d6e5df;border-radius:16px;margin:22px 0;scroll-margin-top:20px}a{color:#007366}.button{display:inline-block;padding:10px 15px;background:#008577;color:white;border-radius:8px;font-size:15px;font-weight:700;text-decoration:none}nav{display:flex;gap:12px;flex-wrap:wrap}summary{font-weight:700;cursor:pointer;padding:12px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #dbe7e1}th{width:58%;font-weight:500}td{font-weight:700}.note{padding:14px;background:#fff6df;color:#73521e;border-radius:8px}footer{font-size:13px;color:#556e61}@media(max-width:600px){main{padding:18px 14px}h1{font-size:24px}h2{font-size:20px}article{padding:18px}body{font-size:14px}.button{font-size:14px}}@media print{@page{size:A4;margin:15mm}body{background:white;font-size:11pt}main{padding:0;max-width:none}article{break-before:page;border:0;padding:0;margin:0}article:first-of-type{break-before:auto}header,nav,.button,footer{display:none}h2{font-size:18pt}details>*{display:block!important}details>summary{display:none!important}table{font-size:10pt}p{margin:8px 0}}</style></head><body><main><header><div class="eyebrow">第10組 · 案例操作手冊</div><h1>從一個情境，串起客戶需求。</h1><p>案例為可選用、可修改的假資料，前台不會自動套入。</p><a href="index.html?v=value2">返回測試首頁</a></header><div id="cases"></div><footer>公司與門牌皆為虛構；分派需人工確認。資料僅在同一瀏覽器保存，未通知銀行。</footer></main><script type="module">
import {DEMO_CASES} from './case-data.js?v=value2';
import {esc} from './opportunity.js?v=value2';
document.getElementById('cases').innerHTML=DEMO_CASES.map(item=>'<article id="case-'+item.id+'"><div class="eyebrow">案例 '+item.id+'</div><h2>'+esc(item.company)+'</h2><p>'+esc(item.address)+'<br>預計用款 '+esc(item.month)+'</p><p>'+esc(item.story)+'</p><a class="button" href="index.html?case='+item.id+'&v=value2#simulator">前往試算頁選用這個案例 →</a><p>進入後按「帶入」才會填入數值，仍可自行調整。</p><details><summary>試算資料</summary><table>'+item.fields.map(([label,value])=>'<tr><th>'+esc(label)+'</th><td>'+esc(value)+'</td></tr>').join('')+'</table></details><details><summary>諮詢內容</summary><p>'+esc(item.note)+'</p></details></article>').join('');
</script></body></html>
