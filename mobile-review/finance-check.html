<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>財務連動與 PDF 檢查</title><style>body{font:14px/1.7 system-ui;margin:18px;color:#214b60;background:#edf7f4}button{padding:12px;background:#007d78;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px}iframe{display:block;width:390px;max-width:100%;height:730px;border:1px solid #a4c7bc}</style></head><body><h1>財務數字連動與 PDF 下載檢查</h1><button id="runFinanceChecks">執行財務與 PDF 檢查</button><pre id="financeCheckResult">尚未執行</pre><iframe id="financeFrame" title="手機版預覽" src="index.html?v=pdf2"></iframe><script type="module">
import {DEMO_CASES} from './case-data.js?v=cases1';
import {FINANCE_DRAFT_KEY} from './finance-state.js?v=pdf1';
const frame=document.getElementById('financeFrame'),output=document.getElementById('financeCheckResult'),pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){for(let i=0;i<200;i++){if(await fn())return;await pause(100)}throw Error('等待頁面狀態逾時')}
document.getElementById('runFinanceChecks').onclick=async function(){this.disabled=true;const results=[],log=(name,pass,observed)=>{results.push({name,pass,observed});output.textContent=JSON.stringify({status:'running',results},null,2)};let w,d,before,originalClick,originalURL,originalRevoke,blob=null;
try{await until(()=>frame.contentDocument?.getElementById('casePicker')?.options.length===4);w=frame.contentWindow;d=w.document;before=w.localStorage.getItem(FINANCE_DRAFT_KEY);await pause(300);
 const apply=id=>{d.getElementById('casePicker').value=id;d.getElementById('applyTeachingCase').click()};
 const set=(id,v)=>{const el=d.getElementById(id);el.value=v;el.dispatchEvent(new w.Event('input',{bubbles:true}))};
 for(const c of DEMO_CASES){apply(c.id);await pause(150);log(c.id+' complete matching health',Object.entries(c.health).every(([k,v])=>Number(d.getElementById('h_'+k).value)===v),Object.fromEntries(Object.keys(c.health).map(k=>[k,d.getElementById('h_'+k).value])));log(c.id+' linked and calculated',!d.getElementById('downloadHealth').disabled&&!d.getElementById('downloadPlan').disabled&&d.getElementById('healthPlanLink').textContent.includes('已連結'),d.getElementById('healthStatus').textContent);}
 apply('01');set('p_sales','15000');d.getElementById('modelForm').requestSubmit();log('annual sales synced',d.getElementById('h_sales').value==='15000'&&!d.getElementById('downloadHealth').disabled,d.getElementById('h_sales').value);log('project amounts not copied as balances',d.getElementById('h_totalDebt').value==='3500'&&d.getElementById('h_cash').value==='500',{debt:d.getElementById('h_totalDebt').value,cash:d.getElementById('h_cash').value});
 set('h_cash','555');d.getElementById('healthForm').requestSubmit();const previousDocument=d;frame.contentWindow.location.reload();await until(()=>frame.contentDocument!==previousDocument&&frame.contentDocument?.readyState==='complete'&&frame.contentDocument?.getElementById('h_cash')?.value==='555');w=frame.contentWindow;d=w.document;
 log('reload retains edits and ready results',d.getElementById('p_sales').value==='15000'&&d.getElementById('h_cash').value==='555'&&!d.getElementById('downloadHealth').disabled,{sales:d.getElementById('p_sales').value,cash:d.getElementById('h_cash').value});
 d.getElementById('businessExample').value='1';d.getElementById('loadBusinessExample').click();log('planning example also updates health',d.getElementById('h_sales').value==='1800'&&d.getElementById('h_profit').value==='54'&&!d.getElementById('downloadHealth').disabled,{sales:d.getElementById('h_sales').value,profit:d.getElementById('h_profit').value});
 d.getElementById('healthScenario').value='stress';d.getElementById('healthExample').click();set('p_sales','2222');d.getElementById('modelForm').requestSubmit();log('independent health scenario preserved',d.getElementById('h_profit').value==='-72'&&d.getElementById('h_sales').value==='900',d.getElementById('healthScenario').value);
 apply('02');await pause(200);originalClick=w.HTMLAnchorElement.prototype.click;originalURL=w.URL.createObjectURL;originalRevoke=w.URL.revokeObjectURL;
 w.HTMLAnchorElement.prototype.click=function(){if(this.download.endsWith('.pdf'))return;return originalClick.call(this)};w.URL.createObjectURL=b=>{blob=b;return 'blob:finance-qa'};w.URL.revokeObjectURL=()=>{};
 for(const id of ['downloadPlan','downloadHealth']){blob=null;d.getElementById(id).click();await until(()=>blob||d.getElementById('toast').textContent.startsWith('PDF 產生失敗'));if(!blob)throw Error(d.getElementById('toast').textContent);const data=new Uint8Array(await blob.arrayBuffer()),txt=new TextDecoder('latin1').decode(data),pages=(txt.match(/\/Type \/Page\b/g)||[]).length;log(id+' real A4 PDF',blob.type==='application/pdf'&&txt.startsWith('%PDF-1.4')&&pages>=2&&txt.includes('595.28 841.89'),{type:blob.type,bytes:blob.size,pages,label:d.getElementById(id).textContent.trim()});await until(()=>!d.getElementById(id).disabled);}
 log('no Excel download labels',!['downloadPlan','downloadHealth'].some(id=>/excel|xlsx/i.test(d.getElementById(id).textContent)),true);
 log('mobile page no overflow',d.documentElement.scrollWidth<=w.innerWidth,{page:d.documentElement.scrollWidth,viewport:w.innerWidth});
 d.getElementById('clearHealth').click();log('clear keeps unknowns blank',[...d.querySelectorAll('#healthFields input')].every(e=>e.value==='')&&d.getElementById('downloadHealth').disabled,true);
}catch(e){log('unexpected error',false,e.message)}finally{if(w&&originalClick){w.HTMLAnchorElement.prototype.click=originalClick;w.URL.createObjectURL=originalURL;w.URL.revokeObjectURL=originalRevoke;}if(w&&before!==undefined){if(before===null)w.localStorage.removeItem(FINANCE_DRAFT_KEY);else w.localStorage.setItem(FINANCE_DRAFT_KEY,before)}this.disabled=false;window.financeCheckResults=results;output.textContent=JSON.stringify({status:'complete',passed:results.filter(x=>x.pass).length,total:results.length,results},null,2);}};
</script></body></html>
