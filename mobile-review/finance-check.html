<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>手動資料轉交檢查</title><style>body{font:14px/1.6 system-ui;background:#edf7f4;color:#214b60;margin:18px}button{background:#007d78;color:#fff;padding:12px;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px}iframe{width:390px;max-width:100%;height:680px;border:1px solid #acc}</style></head><body><h1>手動數字、可編輯案例與後台檢查</h1><p>這是獨立驗證頁。按下後使用虛構數字測試，完成時恢復原有本機資料。</p><button id="runFinanceChecks">執行連動檢查</button><pre id="financeCheckResult">尚未執行</pre><div id="frames"></div><script type="module">
import {estimateRelationship} from './relationship-value.js?v=value2';
import {calculate,diagnose} from './engine.js';
import {financingNeed} from './financing-need.js';
import {LEADS_KEY} from './opportunity.js?v=value2';
import {ROUTING_KEY} from './branch-routing.js?v=cases1';
import {FINANCE_DRAFT_KEY} from './finance-state.js?v=pdf1';
const output=document.getElementById('financeCheckResult'),pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){for(let i=0;i<200;i++){if(fn())return;await pause(80)}throw Error('timeout');}
const plans={
 working:{sales:12345,nextSales:14789,cost:72,dso:55,dio:66,dpo:31,own:512,existing:1900},
 expansion:{setup:457,reserve:99,equity:187,revenue:109,margin:59,fixed:49,ramp:7,interest:3.2,tenor:6,annualBudget:112},
 overseas:{investTwd:347,equityTwd:111,investUsd:83,equityUsd:31,fx:32.7,swing:12,buffer:11,months:13},
 equipment:{invest:5137,equity:1511,interest:3.1,tenor:8,grace:1,annualBudget:987}
};
const health={cash:517,receipts:1900,stock:1600,shortDebt:2500,totalDebt:3500,assets:6500,sales:12345,profit:-9.5,annualAvailable:600,annualDebt:0};
document.getElementById('runFinanceChecks').onclick=async()=>{
 const button=document.getElementById('runFinanceChecks');button.disabled=true;
 const keys=[LEADS_KEY,FINANCE_DRAFT_KEY,ROUTING_KEY],backup=new Map(keys.map(k=>[k,localStorage.getItem(k)])),rows=[];
 let frame,back;
 const log=(name,pass,detail)=>{rows.push({name,pass:!!pass,detail});output.textContent=JSON.stringify({running:true,checks:rows},null,2)};
 const create=async url=>{const f=document.createElement('iframe');f.src=url;document.getElementById('frames').append(f);await until(()=>f.contentDocument?.readyState==='complete'&&f.contentDocument?.querySelector('#consultationForm,#leadRows'));return f;};
 try{
  keys.forEach(k=>localStorage.removeItem(k));
  frame=await create('index.html?case=02&v=value1');let w=frame.contentWindow,d=w.document;
  const set=(id,value)=>{const el=d.getElementById(id);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));};
  log('fresh page and old case URL do not fill numbers',[...d.querySelectorAll('#modelFields input,#healthFields input')].every(e=>e.value===''));
  log('new service choices visible and initially unselected',d.querySelectorAll('#productNeeds [name=consultService]').length===3&&!d.getElementById('productNeeds').closest('details')&&![...d.querySelectorAll('#productNeeds input')].some(x=>x.checked));
  log('examples start collapsed',[...d.querySelectorAll('.optional-examples')].every(e=>!e.open));
  back=await create('internal.html?cases=1&v=value1');
  log('backend empty, old URL cannot seed samples',!back.contentDocument.getElementById('emptyLeads').hidden&&!back.contentDocument.getElementById('loadSamples')&&JSON.parse(localStorage.getItem(LEADS_KEY)||'[]').length===0);
  back.remove();back=null;
  for(const [model,inputs] of Object.entries(plans)){
   d.querySelector('.model-card[data-model="'+model+'"]').click();
   for(const [key,value] of Object.entries(inputs))set('p_'+key,value);
   d.getElementById('modelForm').requestSubmit();
   log(model+' manual plan calculates',d.getElementById('resultStatus').textContent==='已更新');
   if(model==='working')log('same-definition sales link to health',d.getElementById('h_sales').value==='12345'&&d.getElementById('h_totalDebt').value==='');
   for(const [key,value] of Object.entries(health))set('h_'+key,value);
   const f=d.getElementById('consultationForm').elements;
   const fill=(name,value)=>{f[name].value=value;f[name].dispatchEvent(new w.Event('input',{bubbles:true}));};
   fill('company','手動驗證 '+model);fill('businessType','一般中小企業');fill('city','新北市');f.city.dispatchEvent(new w.Event('change',{bubbles:true}));fill('district','新莊區');fill('address','新北市新莊區幸福路171號');fill('note','手動調整金額後送出測試');fill('desiredMonth','2027-03');
   const selected=model==='expansion'?[]:model==='overseas'?['payroll']:['cardAcquiring','payroll','accountOpening'];
   for(const checkbox of d.querySelectorAll('#productNeeds [type=checkbox]')){checkbox.checked=selected.includes(checkbox.value);checkbox.dispatchEvent(new w.Event('input',{bubbles:true}));}
   if(selected.includes('payroll'))fill('payrollEmployees',10);
   f.includePlan.checked=true;f.consent.checked=true;d.getElementById('consultationForm').requestSubmit();
   log(model+' unfinished health blocks stale submission',JSON.parse(localStorage.getItem(LEADS_KEY)||'[]').length===Object.keys(plans).indexOf(model));
   d.getElementById('healthForm').requestSubmit();
   f.consent.checked=true;d.getElementById('consultationForm').requestSubmit();
   const lead=JSON.parse(localStorage.getItem(LEADS_KEY)||'[]')[0];
   log(model+' selected services retained without inferring other needs',JSON.stringify(lead?.services?.filter(x=>x!=='loan').sort())===JSON.stringify([...selected].sort()));
   const amount=financingNeed({model,mode:'dual',inputs,out:calculate(model,{...inputs,mode:'dual'})}).amount;
   log(model+' latest plan values and financing need saved',lead?.plan?.model===model&&Object.entries(inputs).every(([k,v])=>lead.plan.inputs[k]===v)&&Math.abs(lead.consultation.amount-amount)<1e-7,{id:lead?.id,amount:lead?.consultation?.amount});
   log(model+' all 10 health figures, loss and zero saved',Object.entries(health).every(([k,v])=>lead?.consultation?.healthInputs?.[k]===v),lead?.consultation?.healthInputs);
   log(model+' automatic contribution and payroll count linked',estimateRelationship(lead).total!==null&&lead.consultation.payrollEmployees===(selected.includes('payroll')?10:null));
   log(model+' address and appointment saved',lead?.consultation?.address==='新北市新莊區幸福路171號'&&lead?.consultation?.desiredMonth==='2027-03');
  }
  const lead=JSON.parse(localStorage.getItem(LEADS_KEY))[0];
  localStorage.setItem(ROUTING_KEY,JSON.stringify({threshold:600}));
  back=await create('internal.html?v=value2#lead='+lead.id);
  await until(()=>back.contentDocument.getElementById('leadDialog').open);
  const bd=back.contentDocument;
  log('backend displays submitted raw financial figures',bd.querySelector('.received-health-inputs')?.textContent.includes('12,345')&&bd.querySelector('.received-health-inputs')?.textContent.includes('-9.5'));
  log('backend contains only the four submitted records',bd.querySelectorAll('#leadRows tr').length===4&&!bd.body.textContent.includes('宏禾食品包材'));
  log('backend product tags and detail reflect selected needs',['信用卡收單','員工薪轉','公司戶開立'].every(label=>bd.querySelector('.received-consultation').textContent.includes(label)&&bd.getElementById('leadRows').textContent.includes(label)));
  const filter=bd.getElementById('serviceFilter');filter.value='payroll';filter.dispatchEvent(new back.contentWindow.Event('change',{bubbles:true}));
  log('new payroll filter finds only requested cases',bd.querySelectorAll('#leadRows tr').length===3);filter.value='';filter.dispatchEvent(new back.contentWindow.Event('change',{bubbles:true}));
  log('backend auto contribution shows input sources and breakdown',bd.getElementById('relationshipValueResult').textContent.includes('12,345')&&bd.getElementById('relationshipValueResult').textContent.includes('員工延伸貢獻')&&bd.getElementById('relationshipValueResult').textContent.includes('2%～2.5%'));
  const vf=bd.getElementById('relationshipValueForm');vf.closest('details').open=true;vf.elements.bankShare.value=50;vf.elements.bankShare.dispatchEvent(new back.contentWindow.Event('input',{bubbles:true}));vf.requestSubmit();
  log('case assumption saves without changing submitted data',JSON.parse(localStorage.getItem(LEADS_KEY))[0].valueAssumptions.bankShare===50&&JSON.parse(localStorage.getItem(LEADS_KEY))[0].consultation.payrollEmployees===10);
  bd.getElementById('relationshipPricing').open=true;
  const pf=bd.getElementById('relationshipPricingForm'),bw=back.contentWindow;
  const change=(el,value,checked=false)=>{if(checked)el.checked=value;else el.value=value;el.dispatchEvent(new bw.Event('input',{bubbles:true}));};
  log('product interest never auto-confirms a relationship',![...pf.querySelectorAll('[data-pricing-confirm]')].some(x=>x.checked)&&bd.getElementById('relationshipPricingResult').textContent.includes('尚未產生'));
  change(pf.elements.baseRate,3);change(pf.elements.floorRate,2.8);change(pf.elements.capBps,25);
  log('interest alone does not discount the rate',bd.getElementById('relationshipPricingResult').textContent.includes('年利率 3%'));
  for(const [key,bps] of [['cardAcquiring',15],['payroll',10],['accountOpening',5]]){
   const row=pf.querySelector('[data-pricing-product="'+key+'"]');change(row.querySelector('[data-pricing-confirm]'),true,true);change(row.querySelector('[data-pricing-bps]'),bps);change(row.querySelector('[data-pricing-condition]'),'已核對示範往來條件');
  }
  pf.requestSubmit();
  log('confirmed products save capped and floored proposal',bd.getElementById('relationshipPricingResult').textContent.includes('年利率 2.8%')&&JSON.parse(localStorage.getItem(LEADS_KEY))[0].pricing.products.payroll.confirmed&&bd.getElementById('relationshipPricingFeedback').textContent.includes('已保存'));
  bd.getElementById('prepareDispatchMail').click();await until(()=>bd.getElementById('dispatchDialog').open);
  log('actual supervisor preview includes service needs and saved rate proposal',['信用卡收單','員工薪轉','公司戶開立','內部試算 2.8%','非正式報價','年度潛在貢獻','本行取得 50%'].every(text=>bd.getElementById('dispatchBody').textContent.includes(text)));
  log('pricing does not change submitted financial figures',JSON.parse(localStorage.getItem(LEADS_KEY))[0].plan.inputs.interest===3.1);
  bd.getElementById('closeDispatch').click();
  log('backend pricing has no mobile horizontal overflow',bd.getElementById('leadDialog').scrollWidth<=bd.getElementById('leadDialog').clientWidth+1);
  back.remove();back=null;
  d.getElementById('casePicker').value='02';d.getElementById('applyTeachingCase').click();
  set('p_setup',777);d.getElementById('modelForm').requestSubmit();set('h_cash',333);d.getElementById('healthForm').requestSubmit();
  log('optional preset remains fully editable',d.getElementById('p_setup').value==='777'&&d.getElementById('h_cash').value==='333'&&!d.getElementById('downloadHealth').disabled&&!d.getElementById('p_setup').readOnly);
  const prior=d;w.location.reload();await until(()=>frame.contentDocument!==prior&&frame.contentDocument?.readyState==='complete'&&frame.contentDocument?.getElementById('consultationForm'));
  w=frame.contentWindow;d=w.document;
  log('reopening never forces previous case values',[...d.querySelectorAll('#modelFields input,#healthFields input')].every(e=>e.value==='')&&!d.getElementById('restoreFinanceDraft').hidden);
  d.getElementById('restoreFinanceDraft').click();
  log('explicit restore preserves edits instead of preset originals',d.getElementById('p_setup').value==='777'&&d.getElementById('h_cash').value==='333'&&d.getElementById('consultationForm').elements.company.value==='');
  let blob;
  const originalClick=w.HTMLAnchorElement.prototype.click,originalURL=w.URL.createObjectURL,originalRevoke=w.URL.revokeObjectURL;
  w.HTMLAnchorElement.prototype.click=function(){if(!this.download.endsWith('.pdf'))return originalClick.call(this)};
  w.URL.createObjectURL=b=>{blob=b;return 'blob:manual-qa'};w.URL.revokeObjectURL=()=>{};
  try{
   for(const id of ['downloadPlan','downloadHealth']){
    blob=null;d.getElementById(id).click();await until(()=>blob);
    const txt=new TextDecoder('latin1').decode(new Uint8Array(await blob.arrayBuffer()));
    log(id+' valid PDF after editing',blob.type==='application/pdf'&&txt.startsWith('%PDF-1.4')&&txt.includes('595.28 841.89'),{bytes:blob.size});
    await until(()=>!d.getElementById(id).disabled);
   }
  }finally{w.HTMLAnchorElement.prototype.click=originalClick;w.URL.createObjectURL=originalURL;w.URL.revokeObjectURL=originalRevoke;}
  log('390px mobile layout has no horizontal overflow',d.documentElement.scrollWidth<=w.innerWidth,{page:d.documentElement.scrollWidth,viewport:w.innerWidth});
 }catch(error){log('exception',false,error.message)}
 finally{
  frame?.remove();back?.remove();await pause(100);
  for(const [key,value]of backup){if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}
  output.textContent=JSON.stringify({completed:true,passed:rows.filter(x=>x.pass).length,total:rows.length,checks:rows},null,2);button.disabled=false;
 }
};
</script></body></html>
